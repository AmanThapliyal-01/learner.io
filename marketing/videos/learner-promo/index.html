<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-asta"
        class="scene"
        data-composition-id="02-asta"
        data-composition-src="compositions/frames/02-asta.html"
        data-start="4"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-03-check"
        class="scene"
        data-composition-id="03-check"
        data-composition-src="compositions/frames/03-check.html"
        data-start="9.5"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="el-04-gap"
        class="scene"
        data-composition-id="04-gap"
        data-composition-src="compositions/frames/04-gap.html"
        data-start="15"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-close"
        class="scene"
        data-composition-id="05-close"
        data-composition-src="compositions/frames/05-close.html"
        data-start="20.5"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="25"
        data-track-index="11"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":1,"v":0.55},{"t":22.5,"v":0.55},{"t":25,"v":0}]}]}'
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-asta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-02-asta", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 9.5);
        tl.fromTo("#el-03-check", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9.5);
        tl.to("#el-03-check", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.fromTo("#el-04-gap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.to("#el-04-gap", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 20.5);
        tl.fromTo("#el-05-close", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20.5);
        tl.to({}, { duration: 25 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
