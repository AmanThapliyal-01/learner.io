        { skill: 'Power BI', current: 0, target: 3, note: 'Focus · 2 wks' },

      const TRACK = 772;
      const px = function (level) { return (level / 5) * TRACK; };
      const rowsEl = document.getElementById('g04-rows');
      const tl = gsap.timeline({ paused: true });

      tl.fromTo('#g04-stage', { scale: 1 }, { scale: 1.03, duration: 5.5, ease: 'none', transformOrigin: '50% 50%' }, 0);

      tl.fromTo('#g04-card', { y: 50, opacity: 0, rotation: -1 }, { y: 0, opacity: 1, rotation: 0, duration: 0.8, ease: 'expo.out' }, 0.1);

      ROWS.forEach(function (row, i) {
        const covered = row.current >= row.target;
        const wrap = document.createElement('div');
        wrap.innerHTML =
          '<div class="g04-row-head"><span>' + row.skill + '</span><span class="g04-note' + (covered ? ' g04-covered' : '') + '">' + row.note + '</span></div>' +
          '<div class="g04-track">' +
          (covered ? '' : '<div class="g04-gap" style="left:' + px(row.current) + 'px;width:' + (px(row.target) - px(row.current)) + 'px"></div>') +
          '<div class="g04-known' + (covered ? ' g04-covered' : '') + '" style="width:' + Math.max(px(row.current), 0.001) + 'px"></div>' +
          '<div class="g04-goalmark" style="left:' + px(row.target) + 'px"></div>' +
          '</div>';
        rowsEl.appendChild(wrap);
        const at = 0.55 + i * 0.32;
        tl.fromTo(wrap.querySelector('.g04-row-head'), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, at);
        tl.fromTo(wrap.querySelector('.g04-known'), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: 'power3.out' }, at + 0.1);
        tl.fromTo(wrap.querySelector('.g04-goalmark'), { opacity: 0, scaleY: 0.4 }, { opacity: 1, scaleY: 1, duration: 0.25, ease: 'power2.out' }, at + 0.4);
        if (!covered) {
          tl.fromTo(wrap.querySelector('.g04-gap'), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: 'power2.out' }, at + 0.55);
        }
      });

      tl.fromTo('#g04-route', { strokeDashoffset: 6.6 }, { strokeDashoffset: 0, duration: 0.45, ease: 'none' }, 2.45);
      tl.fromTo('#g04-leaf', { scale: 0, transformOrigin: '0% 100%' }, { scale: 1, duration: 0.35, ease: 'back.out(2.4)' }, 2.75);
      tl.fromTo('#g04-plan-h', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 2.7);
