# Local development infrastructure. Host port 5433 because 5432 is already taken on this machine.
services:
  postgres:
    image: postgres:16-alpine
    container_name: learner-postgres
    environment:
      POSTGRES_DB: learner
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: learner_dev  # local-only dev credential
    ports:
      - "5433:5432"
    volumes:
      - learner-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learner -d learner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  learner-pgdata:
