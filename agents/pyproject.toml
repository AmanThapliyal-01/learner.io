[project]
name = "learner-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "amanThapliyal-dev", email = "aman@coedify.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.5",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
learner-agents = "learner_agents:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
